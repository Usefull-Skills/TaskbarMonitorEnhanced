      - name: R306 synthetic protected rollback journal crash and recovery model
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src=(Resolve-Path build/Test-R306-DurableRollbackModel.ps1).Path
          $tok=$null;$err=$null
          [void][Management.Automation.Language.Parser]::ParseFile($src,[ref]$tok,[ref]$err)
          if(@($err).Count){$err|ForEach-Object {$_.Message};throw 'R306_PS51_MODEL_PARSER_INVALID'}
          $prior=Join-Path $env:RUNNER_TEMP ('R305_${{ matrix.host }}_'+$env:GITHUB_RUN_ID+'/R305_ELEVATED_TOKEN_SID_RECEIPT.json')
          $p=Get-Content -LiteralPath $prior -Raw|ConvertFrom-Json
          if($p.SourceCommit -cne $env:GITHUB_SHA -or
             $p.Host -cne '${{ matrix.host }}' -or
             $p.Status -cne 'PASS_EFFECTIVE_PROCESS_TOKEN_SID_BOUND_TO_REQUESTED_USER'){
             throw 'R306_PRIOR_NATIVE_SID_EVIDENCE_NOT_EXACT'
          }
          $main=Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'TaskbarMonitorEnhanced/TaskbarMonitorEnhanced.exe'
          $before=(Get-FileHash -LiteralPath $main -Algorithm SHA256).Hash
          $native=Join-Path ([Environment]::SystemDirectory) 'WindowsPowerShell/v1.0/powershell.exe'
          $lines=@(& $native -NoLogo -NoProfile -NonInteractive -File $src -Mode Driver)
          if($LASTEXITCODE -ne 0){throw 'R306_MODEL_PROCESS_FAILED'}
          $witness=($lines|Where-Object {$_ -like 'R306_PROTOTYPE_PASS Receipt=*'}|Select-Object -Last 1)
          if(!$witness){throw 'R306_MODEL_POSITIVE_WITNESS_MISSING'}
          $origin=[string]$witness.Substring('R306_PROTOTYPE_PASS Receipt='.Length).Trim()
          $actualFile=[IO.Path]::GetFullPath($origin)
          $actualDir=[IO.Path]::GetDirectoryName($actualFile)
          $actualParent=[IO.Path]::GetDirectoryName($actualDir)
          if([IO.Path]::GetFileName($actualFile) -cne 'R306_RECEIPT.json' -or
             [IO.Path]::GetFileName($actualDir) -cnotmatch '^R306_DISPOSABLE_[0-9a-f]{32}$'){
             throw 'R306_RESULT_SYNTHETIC_LAYOUT_UNTRUSTED'
          }
          $allowed=@($env:TEMP,$env:TMP,$env:RUNNER_TEMP,[IO.Path]::GetTempPath())
          $valid=@($allowed|Where-Object {$_ -and
             [string]::Equals([IO.Path]::GetFullPath($_).TrimEnd([IO.Path]::DirectorySeparatorChar),
                              $actualParent,[StringComparison]::OrdinalIgnoreCase)})
          if($valid.Count -lt 1){
             throw ('R306_RESULT_OUTSIDE_SYNTHETIC_TEMP parent='+$actualParent+' allowed='+($allowed -join ';'))
          }
          $r=Get-Content -LiteralPath $origin -Raw|ConvertFrom-Json
          if($r.Schema -ne 1 -or $r.Revision -cne 'R306-PROTOTYPE' -or
             $r.Commit -cne $env:GITHUB_SHA -or
             $r.Status -cne 'PASS_SYNTHETIC_DURABLE_SNAPSHOT_KILL_RESTORE_AND_TAMPER_REFUSAL' -or
             $r.OriginalProtectedServicesTouched -ne $false -or $r.UACInvoked -ne $false -or
             $r.ProgramFilesWritten -ne $false -or $r.ActualProofWorkerKilled -ne $true -or
             $r.SameUserFreshProcessRestore -ne $true -or
             $r.CrossSidRefusedBeforeWrite -ne $true -or $r.MissingReadyMarkerRefused -ne $true -or
             $r.PreWriteSnapshotHashValidation -ne $true -or
             $r.ActualSensorHelperKilled -ne $false -or
             $r.ExternalCanaryPreserved -ne $true){
             throw 'R306_SYNTHETIC_RECEIPT_NOT_ACCEPTED'
          }
          $dest=Join-Path $env:RUNNER_TEMP ('R306_${{ matrix.host }}_'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $dest){throw 'R306_TYPED_RECEIPT_DEST_EXISTS'}
          [void][IO.Directory]::CreateDirectory($dest)
          $copy=Join-Path $dest 'R306_ROLLBACK_MODEL_RECEIPT.json'
          [IO.File]::Copy($origin,$copy,$false)
          if((Get-FileHash -LiteralPath $origin -Algorithm SHA256).Hash -cne
             (Get-FileHash -LiteralPath $copy -Algorithm SHA256).Hash){
             throw 'R306_RAW_RECEIPT_COPY_SHA_MISMATCH'
          }
          if((Get-FileHash -LiteralPath $main -Algorithm SHA256).Hash -cne $before){
             throw 'R306_GUEST_INSTALLED_MAIN_CHANGED'
          }
          'R306_SYNTHETIC_JOURNAL_ACTUAL_WORKER_KILL_PASS_NOT_PRODUCTION_ACCEPTANCE'
