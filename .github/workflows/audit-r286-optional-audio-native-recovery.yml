name: R286 private v1.7.8 candidate and exact interrupted Setup recovery

on:
  push:
    branches: [feature/v1.7.8-optional-audio-r286, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Build private unsigned v1.7.8 candidate (not a public release)
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.400
      - name: Build hash-bound private Setup candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or
             $env:GITHUB_ACTIONS -cne 'true' -or
             $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
             $env:RUNNER_OS -cne 'Windows'){throw 'R286_BAD_HOSTED_SOURCE'}
          $source=Get-Content src/TaskbarMonitorEnhanced.cs -Raw
          if(!$source.Contains('EnableTemperatureWarningSound = false') -or
             !$source.Contains('TemperatureWarningSoundPolicy.ShouldPlay(config)') -or
             !$source.Contains('System.Media.SystemSounds.Exclamation.Play();') -or
             !$source.Contains('Test warning sound')){
             throw 'R286_OPT_IN_AUDIO_FEATURE_UI_AND_POLICY_NOT_PRESENT'
          }
          ./build/Build.ps1
          if($LASTEXITCODE -ne 0){throw 'R286_VERSIONED_BUILD_FAILED'}
          $setup='build/_out/Setup/TaskbarMonitorEnhanced_Setup_1.7.8.exe'
          $main='build/_out/App/TaskbarMonitorEnhanced.exe'
          if(!(Test-Path $setup) -or !(Test-Path $main)){throw 'R286_PRIVATE_BINARIES_MISSING'}
          $record=[ordered]@{
            Schema=1;Status='PRIVATE_NOT_A_RELEASE';Commit=$env:GITHUB_SHA
            Version='1.7.8';Private=$true;NotForPublicInstallation=$true
            SetupSHA256=(Get-FileHash $setup).Hash
            MainSHA256=(Get-FileHash $main).Hash
          }
          [IO.File]::WriteAllText('build/_out/CANDIDATE.json',($record|ConvertTo-Json -Depth 4),[Text.UTF8Encoding]::new($false))
          'R286_CANDIDATE_COMPILED_AND_HASH_BOUND'
      - name: Upload bounded candidate for disposable tests only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: R286-PRIVATE-NOT-PUBLIC-RELEASE
          if-no-files-found: error
          retention-days: 14
          path: |
            build/_out/CANDIDATE.json
            build/_out/Setup/TaskbarMonitorEnhanced_Setup_1.7.8.exe
            build/_out/App/TaskbarMonitorEnhanced.exe

  cold-recovery:
    name: Recovery exact Main candidate on isolated Windows ${{ matrix.host }}
    needs: candidate
    timeout-minutes: 18
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: A
            os: windows-2025
          - host: B
            os: windows-2022
    steps:
      - name: Exact candidate source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Retrieve private candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: R286-PRIVATE-NOT-PUBLIC-RELEASE
          path: _r284_private_candidate
      - name: Preflight script parser and strict disposable host
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or
             $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:COMPUTERNAME -match 'EMAD-PC'){throw 'R286_UNSAFE_NON_DISPOSABLE_HOST'}
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'R286_BAD_SOURCE_CHECKOUT'}
          $p=(Resolve-Path build/Test-R286-RestoreResidue-NativeRecovery.ps1).Path
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
          if(@($errors).Count){$errors|ForEach-Object{$_.Message};throw 'R286_PS51_SCRIPT_PARSER_INVALID'}
          if(!(Test-Path build/official-v177-managed.json)){throw 'R286_PINNED_176_MISSING'}
          $c=Get-Content _r284_private_candidate/CANDIDATE.json -Raw|ConvertFrom-Json
          if($c.Commit -cne $env:GITHUB_SHA -or $c.Version -cne '1.7.8' -or
             $c.Private -ne $true -or $c.NotForPublicInstallation -ne $true){throw 'R286_NOT_EXACT_PRIVATE_CANDIDATE'}
          'R286_GUEST_PRECONDITION_PASS'
      - name: Force helper crash; prove residue recovery, and real Setup kill on B
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          ./build/Test-R286-RestoreResidue-NativeRecovery.ps1 -HostLabel '${{ matrix.host }}' -CandidateDir (Resolve-Path _r284_private_candidate).Path
          if($LASTEXITCODE -ne 0){throw 'R286_GUEST_TEST_FAILED'}
          $p=Join-Path $env:RUNNER_TEMP ('R286_${{ matrix.host }}_'+$env:GITHUB_RUN_ID+'/R286_RECOVERY_RECEIPT.json')
          if(!(Test-Path $p)){throw 'R286_GUEST_RECEIPT_MISSING'}
          $r=Get-Content $p -Raw|ConvertFrom-Json
          if($r.Schema -ne 1 -or $r.Revision -cne 'R286' -or
             $r.Status -cne 'PASS_EXACT_V178_SETUP_RETRY_AFTER_STRANDED_RESTORE' -or
             $r.Host -cne '${{ matrix.host }}' -or
             $r.SourceCommit -cne $env:GITHUB_SHA -or
             $r.PreviousManifestRowsSHAAndSizeChecked -ne 22 -or
             $r.StagingHelperActuallyKilled -ne $true -or
             $r.StrandedUpdaterOwnedRestoreZeroByteProven -ne $true -or
             $r.RecoveredAfterSecondNativeSetupRun -ne $true -or
             $r.SingleCanonicalUserRootPreserved -ne $true -or
             $r.ProtectedUserDataHashPreserved -ne $true -or
             $r.JournalRemoved -ne $true -or
             $r.OriginalOwnerComputerTouched -ne $false -or
             $r.PhysicalMainsLossTriggered -ne $false){throw 'R286_RECEIPT_TYPED_PASS_FAILED'}
          if('${{ matrix.host }}' -ceq 'B' -and
             ($r.NativeSetupProcessActuallyKilled -ne $true -or
              $r.NativeSetupManagedNoteDeletionWitnessed -ne $true)){throw 'R286_REAL_SETUP_KILL_NOT_WITNESSED'}
          'R286_GUEST_TYPED_RECOVERY_PASS'
      - name: R290 reject native child junctions before any recovery mutation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=(Resolve-Path build/Test-R290-ReparseRecovery-Native.ps1).Path
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
          if(@($errors).Count){$errors|ForEach-Object{$_.Message};throw 'R290_NATIVE_TEST_PARSER_INVALID'}
          ./build/Test-R290-ReparseRecovery-Native.ps1 -HostLabel '${{ matrix.host }}' -CandidateDir (Resolve-Path _r284_private_candidate).Path
          # The script throws on failure; LASTEXITCODE can be stale from a prior native Setup.
          # Validate its typed native receipt instead of mistaking that stale code for failure.
          $p=Join-Path $env:RUNNER_TEMP ('R290_${{ matrix.host }}_'+$env:GITHUB_RUN_ID+'/R290_REPARSE_RECEIPT.json')
          if(!(Test-Path $p)){throw 'R290_GUEST_RECEIPT_MISSING'}
          $r=Get-Content $p -Raw|ConvertFrom-Json
          if($r.Schema -ne 1 -or $r.Revision -cne 'R290' -or
             $r.Status -cne 'PASS_NATIVE_UPGRADE_CHILD_REPARSE_FAIL_CLOSED' -or
             $r.Host -cne '${{ matrix.host }}' -or
             $r.SourceCommit -cne $env:GITHUB_SHA -or
             $r.OriginalOwnerComputerTouched -ne $false -or
             $r.NativeWindowsJunctionCreated -ne $true -or
             $r.NormalPathAcceptance -ne $true -or
             $r.ParentTraversalRejected -ne $true -or
             $r.LiveChildJunctionRejected -ne $true -or
             $r.StageOldJunctionRejected -ne $true -or
             $r.RecoverPreMutationRejected -ne $true -or
             $r.NoExternalCanaryMutation -ne $true -or
             $r.InstalledMainAndConfigUnchanged -ne $true -or
             $r.NoStageOrLinkResidue -ne $true){throw 'R290_TYPED_NATIVE_REPARSE_RECEIPT_INVALID'}
          'R290_NATIVE_CHILD_REPARSE_GUARDS_PASS'
      - name: R291 reject untrusted paths before elevated sensor helper writes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=(Resolve-Path build/Test-R291-SensorHelperBoundary-Native.ps1).Path
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
          if(@($errors).Count){$errors|ForEach-Object{$_.Message};throw 'R291_PS51_NATIVE_HARNESS_PARSE_INVALID'}
          ./build/Test-R291-SensorHelperBoundary-Native.ps1 -HostLabel '${{ matrix.host }}' -CandidateDir (Resolve-Path _r284_private_candidate).Path
          $p=Join-Path $env:RUNNER_TEMP ('R291_${{ matrix.host }}_'+$env:GITHUB_RUN_ID+'/R291_BOUNDARY_RECEIPT.json')
          if(!(Test-Path -LiteralPath $p)){throw 'R291_RECEIPT_MISSING'}
          $r=Get-Content -LiteralPath $p -Raw|ConvertFrom-Json
          if($r.Schema -ne 1 -or $r.Revision -cne 'R291' -or
             $r.Status -cne 'PASS_PRIVILEGED_HELPER_BOUNDARY_NATIVE' -or
             $r.SourceCommit -cne $env:GITHUB_SHA -or
             $r.Host -cne '${{ matrix.host }}' -or
             $r.OriginalOwnerComputerTouched -ne $false -or
             $r.ProtectedServicesOrUACInvoked -ne $false -or
             $r.RealWindowsJunctionUsed -ne $true -or
             $r.PositiveAndNegativePathChecksPassed -ne $true -or
             $r.DanglingJunctionRejected -ne $true -or
             $r.EmbeddedHelperSourceMatched -ne $true -or
             $r.InstalledMainUnchanged -ne $true -or
             $r.CheckCount -lt 14 -or
             @($r.Checks|Where-Object {$_ -ceq 'DOWNLOADS_ROOT_WITH_VALID_NAME_REFUSED'}).Count -ne 1 -or
             @($r.Checks|Where-Object {$_ -ceq 'NESTED_TEMP_WITH_VALID_NAME_REFUSED'}).Count -ne 1){throw 'R291_TYPED_BOUNDARY_RECEIPT_INVALID'}
          'R291_NATIVE_ELEVATED_SENSOR_BOUNDARY_GUARDS_PASS'
      - name: R293 execute trusted inline Helper, never rogue writable Temp script
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=(Resolve-Path build/Test-R293-InMemorySensorHelper-Native.ps1).Path
          $tok=$null;$err=$null
          [void][Management.Automation.Language.Parser]::ParseFile($p,[ref]$tok,[ref]$err)
          if(@($err).Count){$err|ForEach-Object {$_.Message};throw 'R293_NATIVE_PS51_PARSER_INVALID'}
          ./build/Test-R293-InMemorySensorHelper-Native.ps1 -HostLabel '${{ matrix.host }}' -CandidateDir (Resolve-Path _r284_private_candidate).Path
          $p=Join-Path $env:RUNNER_TEMP ('R293_${{ matrix.host }}_'+$env:GITHUB_RUN_ID+'/R293_INMEMORY_RECEIPT.json')
          if(!(Test-Path -LiteralPath $p)){throw 'R293_TYPED_RECEIPT_MISSING'}
          $r=Get-Content -LiteralPath $p -Raw|ConvertFrom-Json
          if($r.Schema -ne 1 -or $r.Revision -cne 'R293' -or
             $r.Status -cne 'PASS_NO_TEMP_SCRIPT_ELEVATION_INLINE_TRUSTED_SOURCE' -or
             $r.Host -cne '${{ matrix.host }}' -or $r.SourceCommit -cne $env:GITHUB_SHA -or
             $r.OriginalOwnerComputerTouched -ne $false -or $r.UACOrProtectedServiceCalled -ne $false -or
             $r.ExactTrustedHelperSource -ne $true -or $r.MaliciousTempScriptIgnored -ne $true -or
             (-not([bool]$r.RealNonElevatedEncodedPowerShellCalled -xor
                   [bool]$r.RealNonElevatedInlinePowerShellCalled)) -or
             ($r.RealNonElevatedEncodedPowerShellCalled -eq $true -and
               ($r.BoundedEncodedCommandLength -lt 1000 -or
                $r.BoundedEncodedCommandLength -gt 32000)) -or
             ($r.RealNonElevatedInlinePowerShellCalled -eq $true -and
               ($r.BoundedInMemoryCommandLength -lt 1000 -or
                $r.BoundedInMemoryCommandLength -gt 30000)) -or
             $r.InvalidAppRootRejectedBeforeWrite -ne $true -or
             $r.InstalledMainUnchanged -ne $true -or
             @($r.Checks).Count -lt 9 -or
             @($r.Checks|Where-Object {$_ -ceq 'QUOTED_HOSTILE_USER_INPUT_ENCODED_AS_DATA'}).Count -ne 1 -or
             @($r.Checks|Where-Object {$_ -ceq 'COMMAND_LINE_INJECTION_SENTINEL_NOT_EXECUTED'}).Count -ne 1){throw 'R293_NATIVE_INMEMORY_RECEIPT_REJECTED'}
          'R293_TRUSTED_INMEMORY_HELPER_NEGATIVE=PASS'
      - name: R294 verify locked SHA-pinned executable source, tamper and sharing rejection
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=(Resolve-Path build/Test-R294-PayloadProvenance-Native.ps1).Path
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
          if(@($errors).Count){$errors|ForEach-Object {$_.Message};throw 'R294_NATIVE_PS51_PARSER_INVALID'}
          ./build/Test-R294-PayloadProvenance-Native.ps1 -HostLabel '${{ matrix.host }}' -CandidateDir (Resolve-Path _r284_private_candidate).Path
          $p=Join-Path $env:RUNNER_TEMP ('R294_${{ matrix.host }}_'+$env:GITHUB_RUN_ID+'/R294_PROVENANCE_RECEIPT.json')
          if(!(Test-Path -LiteralPath $p)){throw 'R294_PROVENANCE_RECEIPT_NOT_CREATED'}
          $r=Get-Content $p -Raw|ConvertFrom-Json
          if($r.Schema -ne 1 -or $r.Revision -cne 'R294' -or
             $r.Status -cne 'PASS_SHA_PINNED_EXCLUSIVE_SINGLE_READ_SENSOR_BINARIES' -or
             $r.Host -cne '${{ matrix.host }}' -or $r.SourceCommit -cne $env:GITHUB_SHA -or
             $r.OriginalOwnerComputerTouched -ne $false -or $r.UACOrServiceMutation -ne $false -or
             $r.BothTamperedInputsRejected -ne $true -or $r.ExclusiveLockProved -ne $true -or
             $r.VerifiedBuffersInstalledToSandboxOnly -ne $true -or $r.InstalledMainUnchanged -ne $true -or
             $r.ExpectedBrokerSHA256 -cnotmatch '^[A-F0-9]{64}$' -or
             $r.ExpectedSupervisorSHA256 -cnotmatch '^[A-F0-9]{64}$' -or
             @($r.Checks).Count -lt 10){throw 'R294_TYPED_NATIVE_PROVENANCE_RECEIPT_FAILED'}
          'R294_SHA_PINNED_EXCLUSIVE_VERIFIED_BYTES_PASS'
      - name: R295 verify PE-pinned ZIP dependency bytes and hostile archive rejection
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=(Resolve-Path build/Test-R295-TrustedBackendZip-Native.ps1).Path
          $tok=$null;$err=$null
          [void][Management.Automation.Language.Parser]::ParseFile($p,[ref]$tok,[ref]$err)
          if(@($err).Count){$err|ForEach-Object {$_.Message};throw 'R295_NATIVE_PS51_PARSER_INVALID'}
          ./build/Test-R295-TrustedBackendZip-Native.ps1 -HostLabel '${{ matrix.host }}' -CandidateDir (Resolve-Path _r284_private_candidate).Path
          $p=Join-Path $env:RUNNER_TEMP ('R295_${{ matrix.host }}_'+$env:GITHUB_RUN_ID+'/R295_ZIP_PROVENANCE_RECEIPT.json')
          if(!(Test-Path -LiteralPath $p)){throw 'R295_NATIVE_RECEIPT_NOT_FOUND'}
          $r=Get-Content -LiteralPath $p -Raw|ConvertFrom-Json
          if($r.Schema -ne 1 -or $r.Revision -cne 'R295' -or
             $r.Status -cne 'PASS_PE_PINNED_ZIP_BYTE_ONLY_BACKEND_PROVENANCE' -or
             $r.Host -cne '${{ matrix.host }}' -or $r.SourceCommit -cne $env:GITHUB_SHA -or
             $r.OriginalOwnerComputerTouched -ne $false -or $r.ElevatedUACOrProtectedServiceUsed -ne $false -or
             $r.EmbeddedArchiveSHA256 -cnotmatch '^[A-F0-9]{64}$' -or
             $r.EntryCount -ne 43 -or $r.UncompressedBytes -ne 12203773 -or
             $r.TamperedArchiveRefused -ne $true -or
             $r.TraversalAndDuplicateAndLinkRefused -ne $true -or
             $r.ExclusiveSourceLockVerified -ne $true -or
             $r.VerifiedBytesOnlyCopiedToSandbox -ne $true -or
             $r.InstalledMainUnchanged -ne $true -or @($r.Checks).Count -lt 11){throw 'R295_TYPED_ZIP_RECEIPT_INVALID'}
          'R295_EXACT_ZIP_TRAVERSAL_TAMPER_DUPLICATE_LINK_REFUSAL_PASS'
      - name: R296 prove old sensor rollback stays in private process memory
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=(Resolve-Path build/Test-R296-RollbackMemory-Native.ps1).Path
          $tok=$null;$err=$null
          [void][Management.Automation.Language.Parser]::ParseFile($p,[ref]$tok,[ref]$err)
          if(@($err).Count){$err|ForEach-Object {$_.Message};throw 'R296_NATIVE_PS51_PARSER_INVALID'}
          ./build/Test-R296-RollbackMemory-Native.ps1 -HostLabel '${{ matrix.host }}' -CandidateDir (Resolve-Path _r284_private_candidate).Path
          $p=Join-Path $env:RUNNER_TEMP ('R296_${{ matrix.host }}_'+$env:GITHUB_RUN_ID+'/R296_MEMORY_ROLLBACK_RECEIPT.json')
          if(!(Test-Path -LiteralPath $p)){throw 'R296_MEMORY_ROLLBACK_RECEIPT_MISSING'}
          $r=Get-Content -LiteralPath $p -Raw|ConvertFrom-Json
          if($r.Schema -ne 1 -or $r.Revision -cne 'R296' -or
             $r.Status -cne 'PASS_MEMORY_ONLY_ROLLBACK_NO_USER_TEMP_TRUST' -or
             $r.Host -cne '${{ matrix.host }}' -or $r.SourceCommit -cne $env:GITHUB_SHA -or
             $r.OriginalOwnerComputerTouched -ne $false -or $r.UACOrProtectedServiceCalled -ne $false -or
             $r.PrivateSnapshotFiles -ne 3 -or $r.ForgedUserTempIgnored -ne $true -or
             $r.TwoJunctionDirectionsRejected -ne $true -or
             $r.CorruptedOriginalRestoredFromMemory -ne $true -or
             $r.NoRollbackDiskFiles -ne $true -or $r.InstalledMainUnchanged -ne $true -or
             @($r.Checks).Count -lt 12){throw 'R296_TYPED_GUEST_MEMORY_RECEIPT_INVALID'}
          'R296_ROLLBACK_IN_MEMORY_TAMPER_AND_REPARSE=PASS'
      - name: R297 refuse forged PawnIO automatic elevation from writable Temp
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=(Resolve-Path build/Test-R297-NoPawnAutoElevation-Native.ps1).Path
          $tok=$null;$err=$null
          [void][Management.Automation.Language.Parser]::ParseFile($p,[ref]$tok,[ref]$err)
          if(@($err).Count){$err|ForEach-Object {$_.Message};throw 'R297_NATIVE_PS51_PARSER_INVALID'}
          ./build/Test-R297-NoPawnAutoElevation-Native.ps1 -HostLabel '${{ matrix.host }}' -CandidateDir (Resolve-Path _r284_private_candidate).Path
          $p=Join-Path $env:RUNNER_TEMP ('R297_${{ matrix.host }}_'+$env:GITHUB_RUN_ID+'/R297_PAWN_REFUSAL_RECEIPT.json')
          if(!(Test-Path -LiteralPath $p)){throw 'R297_TYPED_GUEST_RECEIPT_MISSING'}
          $r=Get-Content -LiteralPath $p -Raw|ConvertFrom-Json
          if($r.Schema -ne 1 -or $r.Revision -cne 'R297' -or
             $r.Status -cne 'PASS_NO_UNTRUSTED_PAWNIO_AUTORUN' -or
             $r.Host -cne '${{ matrix.host }}' -or $r.SourceCommit -cne $env:GITHUB_SHA -or
             $r.OriginalOwnerComputerTouched -ne $false -or $r.UACOrDriverServiceMutation -ne $false -or
             $r.FakeTempPawnInstallerIgnored -ne $true -or
             $r.MissingDriverRequiresOfficialExternalConsent -ne $true -or
             $r.ExistingCompatiblePawnIORetained -ne $true -or $r.MainUnchanged -ne $true -or
             @($r.Checks).Count -lt 10){throw 'R297_TYPED_PAWNIO_REFUSAL_RECEIPT_INVALID'}
          'R297_FORGED_TEMP_PAWNIO_ELEVATION_REFUSED=PASS'
      - name: R298 validate pinned Windows PowerShell executable for runas
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=(Resolve-Path build/Test-R298-PinnedPowerShellHost-Native.ps1).Path
          $tok=$null;$err=$null
          [void][Management.Automation.Language.Parser]::ParseFile($p,[ref]$tok,[ref]$err)
          if(@($err).Count){$err|ForEach-Object {$_.Message};throw 'R298_NATIVE_PS51_PARSER_INVALID'}
          ./build/Test-R298-PinnedPowerShellHost-Native.ps1 -HostLabel '${{ matrix.host }}' -CandidateDir (Resolve-Path _r284_private_candidate).Path
          $p=Join-Path $env:RUNNER_TEMP ('R298_${{ matrix.host }}_'+$env:GITHUB_RUN_ID+'/R298_EXPLICIT_POWERSHELL_HOST_RECEIPT.json')
          if(!(Test-Path -LiteralPath $p)){throw 'R298_TYPED_HOST_RECEIPT_MISSING'}
          $r=Get-Content -LiteralPath $p -Raw|ConvertFrom-Json
          if($r.Schema -ne 1 -or $r.Revision -cne 'R298' -or
             $r.Status -cne 'PASS_ABSOLUTE_SYSTEM_POWERSHELL_RUNAS_HOST' -or
             $r.Host -cne '${{ matrix.host }}' -or $r.SourceCommit -cne $env:GITHUB_SHA -or
             $r.OriginalOwnerComputerTouched -ne $false -or $r.UACOrProtectedServiceInvoked -ne $false -or
             $r.AbsoluteHostMatchesSystemDirectory -ne $true -or
             $r.FakeCwdAndPathExecutableIgnored -ne $true -or $r.BothModesPinned -ne $true -or
             $r.NoUntrustedScriptFile -ne $true -or $r.InstalledMainUnchanged -ne $true -or
             @($r.Checks).Count -lt 12){throw 'R298_NATIVE_PINNED_HOST_RECEIPT_INVALID'}
          'R298_SYSTEM_POWERSHELL_HOST_PINNED=PASS'
      - name: R299 reject hostile upgrade journal and remove known files without recursive delete
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=(Resolve-Path build/Test-R299-NonrecursiveStageCleanup-Native.ps1).Path
          $tok=$null;$err=$null
          [void][Management.Automation.Language.Parser]::ParseFile($p,[ref]$tok,[ref]$err)
          if(@($err).Count){$err|ForEach-Object {$_.Message};throw 'R299_NATIVE_PS51_PARSER_INVALID'}
          ./build/Test-R299-NonrecursiveStageCleanup-Native.ps1 -HostLabel '${{ matrix.host }}' -CandidateDir (Resolve-Path _r284_private_candidate).Path
          $p=Join-Path $env:RUNNER_TEMP ('R299_${{ matrix.host }}_'+$env:GITHUB_RUN_ID+'/R299_NONRECURSIVE_CLEANUP_RECEIPT.json')
          if(!(Test-Path -LiteralPath $p)){throw 'R299_TYPED_NATIVE_RECEIPT_MISSING'}
          $r=Get-Content -LiteralPath $p -Raw|ConvertFrom-Json
          if($r.Schema -ne 1 -or $r.Revision -cne 'R299' -or
             $r.Status -cne 'PASS_NONRECURSIVE_ALLOWLISTED_STAGE_CLEANUP' -or
             $r.Host -cne '${{ matrix.host }}' -or $r.SourceCommit -cne $env:GITHUB_SHA -or
             $r.OwnerComputerTouched -ne $false -or
             $r.UnknownFilePreserved -ne $true -or $r.UnknownEmptyDirPreserved -ne $true -or
             $r.NativeJunctionRefused -ne $true -or $r.ExternalCanaryPreserved -ne $true -or
             $r.PositiveNestedStageCleaned -ne $true -or $r.NoStageResidue -ne $true -or
             $r.InstalledUserFilesUnchanged -ne $true -or
             @($r.Checks).Count -lt 6){throw 'R299_NATIVE_RESULT_NOT_ACCEPTED'}
          'R299_BOUNDARY_AND_NONRECURSIVE_CLEANUP=PASS'
      - name: R300 resume safely retired upgrade journal after interruption
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
